[package]
name = "cyberseeker-server"
version = "0.4.0"
edition = "2021"
rust-version = "1.94"

# Backend authoritative — M1 : auth wallet, /spin (CSPRNG), regen de spins,
# idempotence, rate limiting, remote config versionnée, audit.
# Pas de logique économique "en dur" : tout vient de CONFIG_DIR (config/).

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
rand = "0.8"
ed25519-dalek = "2"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
sha2 = "0.10"
anyhow = "1"

[profile.release]
lto = "thin"
strip = "symbols"
